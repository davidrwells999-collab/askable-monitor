name: Check Askable

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      list_only:
        description: "List all currently live opportunities instead of checking for new ones"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: check-askable
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run check-askable
        env:
          ASKABLE_REFRESH_TOKEN: ${{ secrets.ASKABLE_REFRESH_TOKEN }}
          ASKABLE_USER_ID: ${{ secrets.ASKABLE_USER_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ASKABLE_REFRESH_TOKEN_RACHEL: ${{ secrets.ASKABLE_REFRESH_TOKEN_RACHEL }}
          ASKABLE_USER_ID_RACHEL: ${{ secrets.ASKABLE_USER_ID_RACHEL }}
          NTFY_TOPIC_RACHEL: ${{ secrets.NTFY_TOPIC_RACHEL }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          LIST_ONLY: ${{ github.event.inputs.list_only || 'false' }}
        run: node check-askable.js

      - name: Persist seen-opportunities files
        if: always()
        run: |
          if [ -n "$(git status --porcelain 'seen-opportunities*.json')" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen-opportunities*.json
            git commit -m "chore: update seen opportunities [skip ci]"
            git push
          fi
