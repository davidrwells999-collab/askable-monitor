name: Check Askable

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-askable
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run check-askable
        env:
          ASKABLE_REFRESH_TOKEN: ${{ secrets.ASKABLE_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ASKABLE_USER_ID: ${{ secrets.ASKABLE_USER_ID }}
        run: node check-askable.js

      - name: Persist seen-opportunities.json
        run: |
          if [ -n "$(git status --porcelain seen-opportunities.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen-opportunities.json
            git commit -m "chore: update seen opportunities [skip ci]"
            git push
          fi
